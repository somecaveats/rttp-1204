<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>March Pact Debate</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--card:#FFFDF8;--line:#E0D6C2;--navy:#1F2430;--navy2:#2B3040;--text:#2B3040;--mute:#5E6475;--red:#8C2F39;--win:#2E6B4A;--winbg:#E4F0E8;--cream:#F6F1E7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:10px 22px;flex-wrap:wrap;background:var(--navy)}
.tab{min-width:40px;padding:6px 10px;border:1px solid #3A4153;background:var(--navy2);border-radius:6px;font-weight:600;color:#C9CCD6;cursor:pointer;font-size:18px;text-align:center;white-space:nowrap}
.tab.cur{background:var(--red);color:#fff;border-color:var(--red)}
.tab.done{background:var(--winbg);color:var(--win);border-color:var(--winbg)}
.tab.done.cur{background:var(--win);color:#fff;border-color:#9FC7AE;box-shadow:0 0 0 2px #9FC7AE}
.tab .res{font-weight:500;margin-left:4px}
.tab .rid{font-size:13px;font-weight:500;margin-left:3px;opacity:.85}
.sec{margin-left:auto;font-size:14px;color:#AEB3C2;letter-spacing:.08em;text-transform:uppercase}
.title{padding:10px 28px 0}
h1{font-family:"EB Garamond",Georgia,serif;font-weight:600;color:var(--navy);font-size:48px;margin:0;line-height:1.1}
.default{font-size:22px;color:var(--mute);margin:6px 0 0}
.default b{color:var(--navy)}
.tags{margin-top:6px;font-size:16px;color:var(--red);font-weight:600;min-height:20px}
.phases{display:flex;gap:8px;padding:12px 28px 6px}
.ph{flex:1;text-align:center;padding:8px;border-bottom:4px solid var(--line);color:var(--mute);font-size:20px;font-weight:600;cursor:pointer}
.ph.cur{border-color:var(--navy);color:var(--navy)}
main{flex:1;display:grid;grid-template-columns:1.7fr 1fr;gap:22px;padding:8px 28px 14px;min-height:0}
main.narrow{grid-template-columns:3fr 1fr}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;overflow:auto}
.panel h2{margin:0 0 10px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.opt{display:flex;gap:14px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);font-size:28px;line-height:1.25;cursor:pointer;border-radius:6px}
.opt:last-child{border-bottom:none}
.let{flex:none;min-width:44px;height:44px;padding:0 6px;border-radius:22px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:22px}
.opt.new .let,tr.new .let{background:var(--red)}
.opt.dropped{color:#A9A9A9;text-decoration:line-through}
.opt.dropped .let{background:#C9C9C9}
.opt.base{cursor:default;color:var(--mute)}.opt.base .let{background:var(--win)}
.basenote{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--win);background:var(--winbg);color:var(--win);font-size:20px;font-weight:600}
.opt.sup .let{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--navy)}
.stag{flex:none;font-size:16px;font-weight:600;color:var(--navy);letter-spacing:.04em;text-transform:uppercase}
.opt.arg{background:var(--navy);color:var(--cream)}
.opt.arg .let{background:var(--red)}
.opt.arg .who{color:#C9CCD6}
.opt.arg .stag{color:var(--cream)}
.opt.win .let{background:var(--win)}
.opt.win{color:var(--win);font-weight:600}
.otext{flex:1}
.who{display:block;font-size:16px;color:var(--mute);font-weight:400;text-decoration:none}
.del{display:none;flex:none;border:none;background:none;color:#B33;font-size:22px;cursor:pointer;padding:0 4px}
body.ctlon .del{display:inline}
.hint{display:none;font-size:14px;color:var(--mute);margin-top:10px}
body.ctlon .hint{display:block}
/* vote table */
table.vt{width:100%;border-collapse:collapse}
.vt th{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);text-align:center;padding:4px 6px;border-bottom:2px solid var(--line)}
.vt th.l{text-align:left}
.vt td{border-bottom:1px solid var(--line);padding:8px 6px;font-size:24px;line-height:1.2;vertical-align:middle}
.vt td.num{width:96px;text-align:center}
.vt td.tot{width:90px;text-align:center;font-size:32px;font-weight:600;color:var(--navy)}
.vt td.lead{width:70px;text-align:center;font-size:30px;color:var(--navy);cursor:pointer;border-left:1px dashed var(--line)}
.vt td.lead:hover{background:#EEF0F4}
.vt tr.win td{color:var(--win);font-weight:600;background:var(--winbg)}
.vt tr.win td.lead{color:var(--win)}
.vt tr.win .let{background:var(--win)}
.vt tr.out td{color:#A9A9A9}
.vt tr.out .tx{text-decoration:line-through}
.vt tr.out .let{background:#C9C9C9}
.vt .lc{width:60px;cursor:pointer}
.vt .tx{cursor:pointer}
input.n{width:84px;font:inherit;font-size:30px;font-weight:600;text-align:center;padding:4px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy)}
input.n:focus{outline:3px solid #8C93A8}
.defbanner{margin-top:14px;padding:12px 16px;border-radius:8px;background:var(--winbg);color:var(--win);font-size:22px;font-weight:600}
.warnbanner{margin-top:14px;padding:12px 16px;border-radius:8px;background:#EEF0F4;color:var(--navy);font-size:22px;font-weight:600}
.rst{font-weight:600;font-size:22px;white-space:nowrap}
.rst.y{color:var(--win)}.rst.n{color:var(--red)}
/* right panel */
.clock{font-size:120px;font-weight:600;text-align:center;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.clock.warn{color:#B5651D}.clock.zero{color:var(--red)}
.clocklab{text-align:center;color:var(--mute);font-size:18px;margin-bottom:14px}
.maj{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.maj.stack{grid-template-columns:1fr}
.mbox{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.mbox .n{font-size:44px;font-weight:600;color:var(--navy)}
.maj.stack .mbox .n{font-size:64px}
.mbox .l{font-size:15px;color:var(--mute)}
.spk{margin-top:18px;text-align:center;font-size:24px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.spk b{display:block;font-size:72px;line-height:1.05;color:var(--navy);font-variant-numeric:tabular-nums}
.spk b.warn{color:#B5651D}
.note{font-size:20px;color:var(--mute);text-align:center;margin-top:30px}
#ctl{background:var(--navy);color:#eee;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
#ctl button,#ctl select,#ctl input{font:inherit;padding:4px 8px;border-radius:4px;border:1px solid #555;background:var(--navy2);color:#eee}
#ctl input{width:60px}
#ctl .grow{flex:1;min-width:200px;width:auto}
#ctl .k{color:#9aa}
#ctl button.on{background:#C9A86A;color:var(--navy);border-color:#C9A86A}
#ctl .sep{width:1px;height:20px;background:#555;margin:0 4px}
.hidden{display:none!important}
#pact{position:fixed;inset:40px;background:var(--card);border:2px solid var(--navy);border-radius:12px;padding:24px 32px;overflow:auto;font-size:22px;z-index:9}
#pact h2{font-family:"EB Garamond",Georgia,serif;font-size:36px;margin:0 0 12px;color:var(--navy)}
#pact ol>li{margin:8px 0;padding:4px 8px;border-radius:6px}
#pact ol>li.new{background:var(--winbg);color:var(--win)}
#pact ul{margin:4px 0 2px;font-size:19px}
#pact .dflt{color:var(--mute);font-style:italic}
#pact .x{position:absolute;top:12px;right:16px;border:none;background:none;font-size:34px;color:var(--mute);cursor:pointer;line-height:1}
#pact .x:hover{color:var(--red)}
</style>
</head>
<body class="ctlon">
<header id="tabs"></header>
<div class="title"><h1 id="h1"></h1><p class="default" id="def"></p><div class="tags" id="tags"></div></div>
<div class="phases" id="phases"></div>
<main id="main">
  <section class="panel"><h2 id="lefth">Options</h2><div id="opts"></div></section>
  <section class="panel">
    <div id="clockwrap">
      <h2 id="clockh">Clause clock</h2>
      <div class="clock" id="clock">8:00</div>
      <div class="clocklab" id="clocklab"></div>
    </div>
    <div class="maj" id="majbox">
      <div class="mbox"><div class="n" id="majAll">8</div><div class="l">majority if all <span id="presentN">14</span> vote</div></div>
      <div class="mbox" id="mbNow"><div class="n" id="majNow">–</div><div class="l">majority of <span id="votingN">–</span> voting</div></div>
    </div>
    <div class="spk" id="spkbox">Speaker <b id="spk">0:00</b></div>
  </section>
</main>
<div id="ctl">
  <span>Section</span><select id="secSel"><option>02</option><option>12</option></select>
  <span>Present</span><input id="present" type="number" value="14" min="1">
  <span>Voting</span><input id="voting" type="number" placeholder="auto" min="1" title="Leave blank to use the votes entered in the first column">
  <span class="sep"></span>
  <span>Debate min</span><input id="dmin" type="number" min="0" step="0.5" title="Override this clause's debate time; resets the clause clock">
  <button id="bStart">▶ Clock</button><button id="bReset">Reset</button>
  <button id="bS60">Speaker 60s</button><button id="bS30">30s</button><button id="bSStop">Stop</button>
  <span id="vgrp"><button id="bRun">Runoff column</button> <button id="bFama">Fama column</button> <button id="bDef">No option → default</button></span>
  <span id="cgrp"><button id="bSplit">Split consent items</button></span>
  <span class="sep"></span>
  <input id="newText" class="grow" placeholder="New option or rider text…">
  <select id="who"></select>
  <button id="bAddOpt">+ Option</button><button id="bAddRider">+ Rider</button>
  <span class="sep"></span>
  <button id="bPact">Pact so far</button><button id="bCSV">⇩ CSV record</button><button id="bLoad" title="Load a CSV record saved from this page">⇧ Load CSV</button><input type="file" id="fLoad" accept=".csv,text/csv" style="display:none">
  <span class="k">Space clock · ←/→ clause · 1–5 phase · ↑/↓/Enter move between boxes · P pact · H hide bar · F fullscreen</span>
</div>
<div id="pact" class="hidden"></div>
<script>
/* ===== EDIT HERE: options and riders submitted in advance, by section and clause =====
   Options get the labels O1, O2…  Each entry: [text, who submitted it]                  */
const EXTRA = {
  "02": { },
  "12": { }
};
const RIDERS = {
  "02": { },
  "12": { }
};
/* ===== Roster for the "submitted by" dropdown ===== */
const ROSTER = {
  "02": [["Ethan","Boniface"],["Brendan","Oberto"],["Owen","Dandolo"],["Stella","Falier"],["Lucinda","Geoffrey"],["Emma","Baldwin"],["Paddy","Louis"],["Najla","Nivelon"],["Carlos","John"],["Montrell","Martin"],["Alice","Robert"],["Aniela","Anna"],["Neha","Branas"]],
  "12": [["Cameron","Boniface"],["Shrihith","Oberto"],["Mark","Berthold"],["Ashe","Dandolo"],["Dary","Falier"],["Sammy","Baldwin"],["Olivia","Louis"],["Liam","Geoffrey"],["Zoë","Nivelon"],["Lily","John"],["Molly","Martin"],["Mya","Robert"],["Jaclyn","Anna"],["Ava","Branas"]]
};
/* ===== Clause data (from the Position Sheet and the chair card) ===== */
const C = [
 {n:1,t:"Method of imperial selection",min:0,vo:true,def:"A committee of barons elects the emperor after the city falls; the runner-up gets a great fief",o:["A committee of non-Venetian crusader barons","A committee half Venetian and half non-Venetian","A committee that also seats Greek nobles","Leave the method to the election committee"]},
 {n:2,t:"Limits on the emperor’s power",min:8,def:"A council of barons and Venetians checks the emperor",o:["A strong emperor with few limits","A non-hereditary emperor checked by a mixed Venetian/crusader council","An emperor checked by strong feudal lords","An emperor who answers to the Church"]},
 {n:3,t:"Feudalism or pronoia",min:8,noNew:true,def:"Feudalism",o:["Feudalism: hereditary fiefs and oaths of homage","Pronoia: land granted for service, revocable"]},
 {n:4,t:"Principles of land division",min:8,def:"A quarter to the emperor; three-eighths each to Venice and the barons; land for Cistercian monasteries",o:["A quarter to the emperor; the rest to Venice and the army","Equal shares for each faction","A third to a half reserved for the Greeks","No principle; leave it to the committee"],tag:"Land box (monasteries and church holdings) is voted as one of the three riders"},
 {n:"CI",t:"Consent items",min:0,vo:true,consent:true,def:"An item that fails is left out of the Pact",items:["Papal supremacy","Protection of non-combatants"],tag:"One yes/no vote on both items, with no debate, unless someone asks to debate one separately"},
 {n:5,t:"Maritime trade",min:8,def:"Venetian privileges confirmed; rivals barred; a Black Sea monopoly",o:["Venice’s Chrysobull of 1082 confirmed in perpetuity, plus a monopoly","The Chrysobull confirmed, plus a monopoly on Black Sea trade only","Venice receives some concessions but the empire keeps its tax revenue","Equal rights for all Italian merchants"]},
 {n:6,t:"Patriarch identity",min:8,def:"A Latin, chosen by the side that did not supply the emperor",o:["A Greek","A Latin","Two patriarchs, one Greek and one Latin","The side (Venetian or crusader) that did not supply the emperor chooses"]},
 {n:7,t:"Method of Patriarch selection",min:0,vo:true,def:"Appointed by the side that did not supply the emperor",o:["Appointed directly by the crusade leaders","Chosen by the pope alone","Elected locally by clergy; the pope confirms","Two candidates offered to the pope"]},
 {n:8,noSup:true,t:"Terms of union",min:6,noNew:true,maxR:0,def:"Latin doctrine and customs imposed (Filioque, celibate clergy, unleavened bread)",o:["The pope is head of the Church (papal supremacy)","Option A, plus Latin doctrine enforced (the Filioque)","Option B, plus Latin customs enforced (celibate clergy, unleavened bread)","Option C, plus Latin-language mass in the cathedrals (full union)"],tag:"A is already in (papal supremacy) · Vote D, then C, then B (enter yes votes) · No riders"},
 {n:9,noSup:true,t:"Dividing the wealth",min:4,noNew:true,maxR:2,def:"Debts to Venice first, then 50/50",o:["Debts to Venice first, then 50/50 between Venice and the crusaders","Debts first, then equal shares for every crusader","Debts first, then shares by rank"]},
 {n:10,noSup:true,t:"Church property",min:6,noNew:true,maxR:2,tag:"This debate covers relics (clause 11) too",def:"Excessive church property may be taken",o:["Protected absolutely","May be taken if deemed “excessive”","Fair game"]},
 {n:11,noSup:true,t:"Relics",min:0,vo:true,maxR:2,tag:"Debated with clause 10",def:"Relics may not be taken",o:["May not be taken under any circumstance","Only the duly elected emperor may distribute them","May be taken by anyone"]},
 {n:12,noSup:true,t:"Penalty for breaking the agreed-upon rules",min:5,noNew:true,maxR:2,def:"No penalty set; commanders decide",o:["Loss of any share in land and treasure","Death","Confession and penance"]},
];
const PH_FULL=["Support","Debate","Vote","Riders","Record"],PH_VO=["Support","Vote","Riders","Record"],PH_C=["Vote","Record"];
const phs=c=>{const L=c.consent?PH_C:c.vo?PH_VO:PH_FULL;return L.filter(x=>!(c.noSup&&x=="Support")&&!(c.maxR===0&&x=="Riders"));};
const KEY="mpd6";
let S={sec:"02",cur:0,present:14,voting:null,cl:{}};
try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(S,JSON.parse(s));}catch(e){}
Object.keys(S.cl).forEach(key=>{const i=+key.split("-")[1],k=S.cl[key];if(C[i]&&C[i].n==12&&!k.min&&!winner0(k)){k.min=5;k.left=300;}});
function winner0(k){return (k.opts||[]).some(o=>o.win)||k.def;}
function migrate(){Object.keys(S.cl).forEach(key=>{const i=+key.split("-")[1],k=S.cl[key],c=C[i];if(!c||typeof c.n!="number"||c.n<8||k.consent)return;
  const started=(k.opts||[]).some(o=>o.win||o.s||o.v&&(o.v.vote||o.v.run||o.v.fama))||k.def||(k.riders||[]).length;
  if(!started&&k.left===k.min*60){k.min=c.min;k.left=c.min*60;}});}
migrate();
function baseA(c,k){if(c.n!=8)return false;const ci=C.findIndex(x=>x.consent),kk=S.cl[S.sec+"-"+ci];return !!(kk&&cres(kk)[0]=="y");}
function defOf(c){if(c.n==8){const ci=C.findIndex(x=>x.consent),k=S.cl[S.sec+"-"+ci];
  if(k&&cres(k)[0]=="y")return "A. The pope is head of the Church (already adopted with the consent items)";}
  return c.def;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function st(i,sec){sec=sec||S.sec;const k0=sec+"-"+i;
  if(!S.cl[k0]){const c=C[i];
    if(c.consent){S.cl[k0]={ph:"Vote",consent:true,split:false,opts:[],riders:[],items:[{t:"Both items together",yes:"",no:"",s:""}].concat(c.items.map(t=>({t,yes:"",no:"",s:""}))),min:0,left:0};return S.cl[k0];}
    const opts=c.o.map((t,j)=>({l:"ABCD"[j],t,s:"",v:{}}));
    ((EXTRA[sec]||{})[c.n]||[]).forEach(([t,w],j)=>opts.push({l:"O"+(j+1),t,who:w,s:"",nw:1,v:{}}));
    const riders=((RIDERS[sec]||{})[c.n]||[]).map(([t,w])=>({t,who:w,s:"",yes:"",no:""}));
    S.cl[k0]={ph:"Support",opts,riders,min:c.min,left:c.min*60,run:false,fama:false,def:false};}
  return S.cl[k0];}
const $=id=>document.getElementById(id);
let timer=null,spkT=null,spkLeft=0,pactNew=-1;
const maj=n=>n?Math.floor(n/2)+1:"–";
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const num=x=>{const n=parseFloat(x);return isNaN(n)?null:n;};
const esc=t=>String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const live=k=>k.opts.filter(o=>o.s!="drop");
function total(k,o){
  const r=k.run&&!o.out?num(o.v.run):null;
  const base=r!==null?r:num(o.v.vote);
  const f=k.fama&&!o.out?num(o.v.fama):null;
  if(base===null&&f===null)return null;return (base||0)+(f||0);}
function cast(k){let t=0,any=false;live(k).forEach(o=>{if(num(o.v.vote)!==null){t+=num(o.v.vote);any=true;}});return any?t:null;}
function winner(k){return k.opts.find(o=>o.win);}
function rstat(r){const y=num(r.yes),n=num(r.no);if(y!==null||n!==null){return (y||0)>(n||0)?"y":"n";}return r.s;}
const ridersY=k=>k.riders.filter(r=>rstat(r)=="y");
function cres(k){return [1,2].map(j=>rstat(k.split?k.items[j]:k.items[0]));}
function isDone(k){if(k.consent)return cres(k).every(x=>x=="y"||x=="n");return !!winner(k)||k.def;}
function tabLabel(i){const k=st(i),w=winner(k);let h=`${C[i].n}`;
  if(k.consent){if(isDone(k))h+=`<span class="res">· ${cres(k).filter(x=>x=="y").length}/2</span>`;return h;}
  if(w)h+=`<span class="res">· ${w.l}</span>`;else if(k.def)h+=`<span class="res">· Def</span>`;
  const r=ridersY(k).length;if(isDone(k)&&r)h+=`<span class="rid">+${r}r</span>`;return h;}
function curPh(c,k){const L=phs(c);if(!L.includes(k.ph))k.ph=L[0];return k.ph;}

function render(){
  const c=C[S.cur],k=st(S.cur),ph=curPh(c,k);
  document.body.classList.toggle("ctlon",!$("ctl").classList.contains("hidden"));
  $("tabs").innerHTML=C.map((x,i)=>`<div class="tab ${i==S.cur?"cur":""} ${isDone(st(i))?"done":""}" data-i="${i}">${tabLabel(i)}</div>`).join("")+`<span class="sec">Section ${S.sec}</span>`;
  $("h1").textContent=c.consent?c.t:`Clause ${c.n}: ${c.t}`;
  $("def").innerHTML=c.consent?`<b>If an item fails:</b> it is left out of the Pact`:`<b>If no option is adopted:</b> ${esc(defOf(c))}`;
  const tags=[];if(c.vo&&!c.consent)tags.push("Vote only");if(c.vo||c.noNew)tags.push("No new options");if(c.tag)tags.push(c.tag);
  $("tags").textContent=tags.join(" · ");
  $("phases").innerHTML=phs(c).map((p,i)=>`<div class="ph ${p==ph?"cur":""}" data-p="${i}">${i+1}. ${p}</div>`).join("");
  const ae=document.activeElement,focusId=ae&&ae.dataset?ae.dataset.f:null;
  if(c.consent) renderConsent(c,k);
  else if(ph=="Vote") renderVote(c,k);
  else if(ph=="Riders"||ph=="Record") renderRiders(c,k,ph);
  else renderOpts(c,k,ph);
  // right panel
  const rid=ph=="Riders"&&!c.consent&&(c.maxR??3)>0;if(k.rleft===undefined)k.rleft=RIDER_SEC;
  const showClock=ph=="Debate"||rid;
  $("clockwrap").classList.toggle("hidden",!showClock);
  $("main").classList.toggle("narrow",ph=="Vote"&&!c.consent);
  $("majbox").classList.toggle("stack",!showClock);
  $("mbNow").classList.toggle("hidden",ph=="Support");
  $("spkbox").classList.toggle("hidden",ph=="Support"||(ph=="Vote"&&!c.consent));
  const cv=rid?k.rleft:k.left;

$("bLoad").onclick=()=>$("fLoad").click();
$("fLoad").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{stop();const r=loadCSV(rd.result);if(r.secs.length&&!r.secs.includes(S.sec))S.sec=r.secs[0];render();
      $("bLoad").textContent="✓ Loaded · Section "+r.secs.join(" & ");}
    catch(err){$("bLoad").textContent="✗ Couldn’t load: "+err.message;}
    setTimeout(()=>{$("bLoad").textContent="⇧ Load CSV";},6000);e.target.value="";};
  rd.readAsText(f);};

document.addEventListener("keydown",e=>{
  if(e.key=="Escape"){closePact();return;}
  const el=e.target;
  if(el.classList&&el.classList.contains("n")&&["ArrowUp","ArrowDown","Enter"].includes(e.key)){
    e.preventDefault();const col=el.dataset.col,row=+el.dataset.row;
    const all=[...document.querySelectorAll(`input.n[data-col="${col}"]`)].sort((a,b)=>a.dataset.row-b.dataset.row);
    const i=all.indexOf(el),j=e.key=="ArrowUp"?i-1:i+1;if(all[j]){all[j].focus();all[j].select();}
    return;}
  if(el.tagName=="INPUT"||el.tagName=="SELECT")return;
  if(e.key==" "){e.preventDefault();toggle();}
  else if(e.key=="ArrowRight"&&S.cur<C.length-1){stop();S.cur++;render();}
  else if(e.key=="ArrowLeft"&&S.cur>0){stop();S.cur--;render();}
  else if("12345".includes(e.key)){setPhase(+e.key-1);}
  else if(e.key=="h"||e.key=="H"){$("ctl").classList.toggle("hidden");render();}
  else if(e.key=="f"||e.key=="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}
  else if(e.key=="p"||e.key=="P"){$("pact").classList.contains("hidden")?openPact():closePact();}
});
render();
</script>
</body>
</html>

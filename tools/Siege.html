<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Siege of Constantinople</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="xlsx.full.min.js"></script>
<style>
:root{--bg:#F6F1E7;--card:#FFFDF8;--line:#E0D6C2;--navy:#1F2430;--navy2:#2B3040;--text:#2B3040;--mute:#5E6475;--red:#8C2F39;--redbg:#F6E3E5;--win:#2E6B4A;--winbg:#E4F0E8;--amber:#8A5A12;--amberbg:#FBEFD9;--grey:#8D93A1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:10px 22px;flex-wrap:wrap;background:var(--navy)}
.tab{padding:6px 14px;border:1px solid #3A4153;background:var(--navy2);border-radius:6px;font-weight:600;color:#C9CCD6;cursor:pointer;font-size:17px;white-space:nowrap}
.tab .st{font-weight:500;font-size:14px;margin-left:6px;opacity:.9}
.tab.off{opacity:.45}
.tab.cur{background:var(--red);color:#fff;border-color:var(--red)}
.tab.done{background:var(--winbg);color:var(--win);border-color:var(--winbg)}
.tab.fail{background:var(--redbg);color:var(--red);border-color:var(--redbg)}
.tab.done.cur{background:var(--win);color:#fff;border-color:var(--win)}
.tab.fail.cur{background:var(--red);color:#fff;border-color:var(--red)}
.sec{margin-left:auto;font-size:14px;color:#AEB3C2;letter-spacing:.08em;text-transform:uppercase}
.title{padding:10px 28px 0}
h1{font-family:"EB Garamond",Georgia,serif;font-weight:600;color:var(--navy);font-size:46px;margin:0;line-height:1.1}
.sub{font-size:21px;color:var(--mute);margin:6px 0 0}
.sub b{color:var(--navy);font-weight:600}
.phases{display:flex;gap:8px;padding:12px 28px 4px}
.ph{flex:1;text-align:center;padding:8px;border-bottom:4px solid var(--line);color:var(--mute);font-size:20px;font-weight:600;cursor:pointer}
.ph.cur{border-color:var(--navy);color:var(--navy)}
main{flex:1;display:grid;grid-template-columns:2.3fr 1fr;gap:22px;padding:10px 28px 14px;min-height:0}
main.one{grid-template-columns:1fr}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 20px;overflow:auto}
.panel h2{margin:0 0 10px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:600}
.glyph{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",sans-serif;font-weight:400;margin-right:6px}
table.at{width:100%;border-collapse:collapse;table-layout:fixed}
.at th{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);text-align:center;padding:4px 6px;border-bottom:2px solid var(--line);font-weight:600}
.at th.l{text-align:left}
.at td{border-bottom:1px solid var(--line);padding:6px 6px;font-size:22px;vertical-align:middle;text-align:center}
.at td.nm{text-align:left;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn{font-size:22px;color:var(--navy)}
.stu{font-size:15px;color:var(--mute);margin-left:8px}
.sbf{color:#B8860B;margin-left:6px}
.at tr.grp td{background:#F1EBDD;font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--navy);text-align:left;padding:7px 8px}
.at tr.crew td.nm{padding-left:26px}
.at td.with{font-size:16px;color:var(--mute);font-style:italic}
.at td.tot{font-size:30px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;width:70px}
.at td.bon{width:60px;color:var(--navy)}
select.sp{font:inherit;font-size:18px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy)}
select.sp.over{outline:3px solid var(--red)}
td .rbox{display:inline-flex;align-items:center;gap:4px}
button.die{border:none;background:none;cursor:pointer;font-size:24px;color:var(--mute);padding:0 2px;line-height:1}
button.die:hover{color:var(--navy)}
input.roll{width:52px;font:inherit;font-size:26px;font-weight:600;text-align:center;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy)}
input.roll:focus{outline:3px solid #8C93A8}
.res{font-weight:600;font-size:19px;letter-spacing:.06em;white-space:nowrap}
.res.y{color:var(--win)}.res.n{color:var(--red)}.res.s{color:var(--red)}
.first{display:inline-block;background:var(--win);color:#fff;font-size:12px;letter-spacing:.08em;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle}
.at tr.won td{background:var(--winbg)}
.at tr.out td{color:#A9A9A9;font-size:18px;padding:4px 6px}
.at tr.out .cn,.at tr.out .stu{color:#A9A9A9;font-size:17px}
.need{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:baseline;font-size:21px;margin-bottom:10px}
.need .n{font-size:52px;font-weight:600;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.need .l{color:var(--navy);font-weight:500}
.need .l small{display:block;font-size:15px;color:var(--mute);font-weight:400}
.keys{font-size:16px;color:var(--mute);line-height:1.45;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.keys b{color:var(--navy)}
.banner{border-radius:10px;padding:14px 16px;margin-bottom:14px;text-align:center;color:#fff}
.banner .big{font-family:"EB Garamond",Georgia,serif;font-size:34px;font-weight:600;line-height:1.1}
.banner .sm{font-size:18px;margin-top:4px}
.banner.ok{background:var(--win)}.banner.bad{background:var(--red)}
.tally{display:flex;gap:10px;margin-bottom:12px}
.tally>div{flex:1;border-left:6px solid var(--line);padding:2px 10px}
.tally .num{font-size:40px;font-weight:600;color:var(--navy);line-height:1}
.tally .lab{font-family:"EB Garamond",Georgia,serif;font-variant:small-caps;font-size:22px;font-weight:600}
.tally .y{border-color:var(--win)}.tally .y .lab{color:var(--win)}
.tally .n{border-color:var(--red)}.tally .n .lab{color:var(--red)}
.tally .p{border-color:var(--grey)}.tally .p .lab{color:var(--grey)}
.held{font-size:16px;color:var(--mute);margin-top:8px}
/* round 3 */
.offer{font-family:"EB Garamond",Georgia,serif;font-size:30px;color:var(--navy);line-height:1.25;margin-bottom:14px}
.price{display:flex;align-items:baseline;gap:14px;margin:6px 0 4px}
.price .n{font-size:80px;font-weight:600;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.price .l{font-size:22px;color:var(--mute)}
.bar{height:22px;border-radius:11px;background:#ECE6D8;overflow:hidden;margin:6px 0 14px}
.bar div{height:100%;background:var(--win)}
.pl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;border:1px solid var(--line);border-radius:24px;background:#fff;font-size:19px;min-width:0}
.pc .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .stu{font-size:13px;margin-left:5px}
.pc.deal{background:var(--win);border-color:var(--win);color:#fff}.pc.deal .stu{color:#DDEFE3}.pc.deal .cn{color:#fff}.pc.deal .amt{color:#fff}
.pc input{width:56px;font:inherit;font-size:20px;font-weight:600;text-align:center;border:1px solid var(--line);border-radius:14px;padding:2px;color:var(--navy)}
.pc .amt{font-weight:600;color:var(--win);font-size:20px}
.rules3{font-size:17px;line-height:1.4;padding-left:20px;margin:6px 0 16px}.rules3 li{margin-bottom:6px}
.gbtn{display:block;width:100%;font:inherit;font-family:"EB Garamond",Georgia,serif;font-size:30px;font-weight:600;padding:12px;border-radius:10px;border:none;background:var(--win);color:#fff;cursor:pointer;margin-bottom:10px}
.gbtn:disabled{background:#C9CFC9;cursor:not-allowed}
.gbtn.shut{background:#fff;color:var(--red);border:2px solid var(--red);font-size:20px;padding:8px}
.gbtn.undo{background:#fff;color:var(--mute);border:1px solid var(--line);font-size:17px;padding:6px}
.clock{font-size:96px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;color:var(--navy);line-height:1;margin:4px 0 12px}
.clock.warn{color:var(--amber)}.clock.zero{color:var(--red)}
/* sack */
.so{width:100%;border-collapse:collapse}
.so td{border-bottom:1px solid var(--line);padding:6px 6px;font-size:21px;vertical-align:middle}
.so td.k{width:44px;text-align:center;font-weight:600;color:#fff}
.so td.k span{display:inline-flex;width:34px;height:34px;border-radius:17px;background:var(--navy);align-items:center;justify-content:center;font-size:17px}
.so tr.band td{background:#F1EBDD}
.so tr.cur td{background:#E3E6EE}

.so td.nm{white-space:nowrap}
.so td.tier{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);width:170px}
.so select{font:inherit;font-size:18px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy)}
.so td.slot{font-weight:600;color:var(--navy);white-space:nowrap;width:150px}
.so td.slot .cd{font-size:13px;color:var(--mute);font-weight:500;margin-left:4px}
.so td.mv{width:60px;white-space:nowrap}
.so td.mv button{border:none;background:none;font-size:18px;cursor:pointer;color:var(--mute);padding:0 3px}
body:not(.ctlon) .so td.mv{display:none}
.nx{font-size:21px}
.nx div{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line)}
.nx b{color:var(--navy);font-weight:600}
.nx .full{color:#A9A9A9}
/* setup */
.st-t{width:100%;border-collapse:collapse;font-size:17px}
.st-t th{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);text-align:left;padding:4px 6px;border-bottom:2px solid var(--line)}
.st-t td{padding:5px 6px;border-bottom:1px solid var(--line)}
.st-t input[type=checkbox]{width:22px;height:22px;cursor:pointer}
.st-t td.chg{font-weight:600}.st-t td.chg.pos{color:var(--win)}.st-t td.chg.neg{color:var(--red)}
.st-t td.now{font-weight:600;color:var(--navy);font-size:19px}
.st-t input[type=number]{width:64px;font:inherit;padding:2px 4px}
.st-t select{font:inherit;padding:2px 4px}
.st-t tr.abs td{color:#A9A9A9}
.warn{color:var(--red);font-weight:600;font-size:15px}
#ctl{background:var(--navy);color:#eee;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
#ctl button,#ctl select,#ctl input{font:inherit;padding:4px 8px;border-radius:4px;border:1px solid #555;background:var(--navy2);color:#eee}
#ctl button.on{background:#C9A86A;color:var(--navy);border-color:#C9A86A}
#ctl .sep{width:1px;height:20px;background:#555;margin:0 4px}
#ctl .msg{color:#C9A86A}
#ctl .k{color:#9aa;margin-left:auto}
.overlay{position:fixed;inset:0;background:rgba(31,36,48,.88);display:flex;align-items:center;justify-content:center;z-index:50}
.overlay .box{background:var(--card);border-radius:14px;padding:40px 54px;text-align:center;max-width:900px}
.overlay h2{font-family:"EB Garamond",Georgia,serif;font-weight:600;font-size:60px;margin:0 0 12px;color:var(--navy)}
.overlay p{font-size:24px;color:var(--mute);margin:0 0 24px;line-height:1.45}
.overlay p b{color:var(--navy)}
.ovbtn{padding:10px 22px;border-radius:7px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;cursor:pointer;font-size:18px;font-family:inherit}
#ctl a{color:#C9CCD6;text-decoration:none;border:1px solid #555;border-radius:4px;padding:4px 8px}
#ctl a:hover{color:#fff}
.hidden{display:none!important}
</style>
</head>
<body class="ctlon">
<header id="tabs"></header>

<main id="main"></main>
<div id="overlay" class="overlay hidden"><div class="box"><h2 id="ovH"></h2><p id="ovP"></p><button class="ovbtn" id="ovB">Continue</button></div></div>
<div id="ctl">
  <select id="secSel" title="Section"><option value="02">Section 02</option><option value="12">Section 12</option></select>
  <button id="loadBtn" title="Load the Fama Tracker (.xlsx), Totals tab">Load fama…</button>
  <input type="file" id="file" accept=".xlsx,.xls,.csv" class="hidden">

  <span class="sep"></span>

  <button id="sackBtn" title="Sack order and places">Sack CSV</button>

</form>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const G=g=>`<span class="glyph">${g}︎</span>`;
const FAC={"Imperial":"♛","Venetian":"⚓","Northern French":"⚜","Clerical":"☩","Indeterminate":"⚖"};
const FACNAME={"Imperial":"Imperials","Venetian":"Venetians","Northern French":"N. French","Clerical":"Clerics","Indeterminate":"Indeterminates"};
const CHAR={1:["Boniface of Montferrat","Imperial"],11:["Oberto of Biandrate","Imperial"],16:["Berthold of Katzenelnbogen","Imperial"],2:["Enrico Dandolo","Venetian"],7:["Angelo Falier","Venetian"],3:["Baldwin of Flanders","Northern French"],6:["Louis of Blois","Northern French"],15:["Geoffrey of Villehardouin","Northern French"],4:["Nivelon of Soissons","Clerical"],8:["John of Noyon","Clerical"],12:["Martin of Pairis","Clerical"],5:["Robert of Clari","Indeterminate"],10:["Empress Anna","Indeterminate"],14:["Theodore Branas","Indeterminate"]};
const ROSTER={"02":[["Ethan",1],["Brendan",11],["Owen",2],["Stella",7],["Lucinda",15],["Emma",3],["Paddy",6],["Najla",4],["Carlos",8],["Montrell",12],["Alice",5],["Aniela",10],["Neha",14]],
"12":[["Cameron",1],["Shrihith",11],["Mark",16],["Ashe",2],["Dary",7],["Sammy",3],["Olivia",6],["Liam",15],["Zoë",4],["Lily",8],["Molly",12],["Mya",5],["Jaclyn",10],["Ava",14]]};
const CAPS=["Dandolo","Falier","Oberto"];
const REG=[["G","Great Palace"],["B","Blachernae"],["M","Merchant’s Quarter"],["P","Petrion"],["R","Greek Residential"]];
const ORD=["1st","2nd","3rd","4th","5th","6th"];
const SPEND=[0,1,2], SPCOST={0:0,1:1,2:4};
const PH=["To the Walls","Over the Walls","Into the City"];
const NAMES=[["Boniface","Boniface"],["Oberto","Oberto"],["Berthold","Berthold"],["Dandolo","Dandolo"],["Falier","Falier"],["Barbo","Barbo"],["Geoffrey","Geoffrey"],["Baldwin","Baldwin"],["Louis","Louis"],["Nivelon","Nivelon"],["John","John"],["Martin","Martin"],["Robert","Robert"],["Anna","Anna"],["Branas","Branas"]];
const short=c=>{c=c||"";const m=NAMES.find(([k])=>c.includes(k));return m?m[1]:c.split(/ of | /)[0]};
const fullCap=k=>{const p=D().players.find(x=>capOf(x.char)===k);return p?p.char:k};
const capOf=c=>CAPS.find(k=>new RegExp(k).test(c||""))||null;

function fresh(sec){return{players:ROSTER[sec].map(([s,id],i)=>({id:sec+"-"+i,stu:s,char:CHAR[id][0],fac:CHAR[id][1],fama:0,wall:capOf(CHAR[id][0])?"cap":"land",vol:false,here:true})),sb:"",loaded:"",rounds:{1:{step:1,r:{}},2:{step:1,r:{}}},r3:{deal:"",pl:{},done:false,lost:false,clock:180,run:false},sack:{order:null,ch:{}}}}
let S={sec:"02",tab:"r1",setup:false,data:{}};
try{const x=JSON.parse(localStorage.getItem("siege1"));if(x&&x.data)S=x}catch(e){}
["02","12"].forEach(s=>{if(!S.data[s])S.data[s]=fresh(s)});
const save=()=>{try{localStorage.setItem("siege1",JSON.stringify(S))}catch(e){}};
const D=()=>S.data[S.sec];
const P=id=>D().players.find(p=>p.id===id);
const sbOf=p=>D().sb&&p.fac===D().sb?1:0;

/* ---------- fama: every change, in order ---------- */
// changes(upto): fama changes from rounds before `upto` (9 = everything)
function changes(upto=9){
  const out=[],d=D();
  const spends=R=>{const e=evalRound(R);e.parts.forEach(x=>[1,2,3].forEach(k=>{const c=cell(R,x.p.id,k);if(+c.sp)out.push([x.p.id,"Spent",SPCOST[+c.sp],`Siege round ${R}, step ${k}: +${c.sp} to roll`])}));
    e.parts.forEach(x=>{if(e.st[x.p.id].s1==="s")out.push([x.p.id,"Penalty",1,`Siege round ${R}: ship sank`])});return e};
  if(upto<=1)return out;
  const e1=spends(1);
  if(e1.outcome==="fell"){e1.parts.forEach(x=>{if(e1.st[x.p.id].s1!=="s")out.push([x.p.id,"Earned",1,"Siege round 1: the city fell"])});out.push([e1.first,"Earned",1,"First into the city"]);return out}
  if(e1.outcome!=="failed")return out;
  e1.parts.forEach(x=>{if(e1.st[x.p.id].s1!=="s")out.push([x.p.id,"Penalty",1,"Siege round 1 failed"])});
  if(upto<=2)return out;
  const e2=spends(2);
  if(e2.outcome==="fell"){out.push([e2.first,"Earned",1,"First into the city"]);return out}
  if(e2.outcome!=="failed"||upto<=3)return out;
  const r3=d.r3;
  if(r3.done){Object.entries(r3.pl).forEach(([id,n])=>{if(+n>0)out.push([id,"Spent",+n,"Bribe to open the gates"])});out.push([r3.deal,"Earned",1,"Opened the gates: first into the city"])}
  else if(r3.lost){const before=famaMap(3);d.players.forEach(p=>{const n=Math.max(0,before[p.id]);if(n)out.push([p.id,"Penalty",n,"The gates stayed shut: the crusade collapses"])})}
  return out}
function famaMap(upto=9){const m={};D().players.forEach(p=>m[p.id]=+p.fama||0);changes(upto).forEach(([id,t,n])=>{if(m[id]==null)return;m[id]+=t==="Earned"?n:-n});return m}
function cell(R,id,k){const r=D().rounds[R].r;return(r[id]&&r[id][k])||{}}

/* ---------- one round ---------- */
function shipOf(p){if(p.wall==="cap")return capOf(p.char);if(CAPS.includes(p.wall))return p.wall;return null}
function participants(R){
  const here=D().players.filter(p=>p.here),capP=k=>here.find(p=>p.wall==="cap"&&capOf(p.char)===k),out=[];
  here.forEach(p=>{let ship=shipOf(p);const cp=ship?capP(ship):null;if(ship&&!cp)ship=null;
    if(R===1){if(ship){if(!cp.vol)return}else if(!p.vol)return}
    out.push({p,ship})});
  return out}
function evalRound(R){
  const fb=famaMap(R),fam=id=>fb[id];
  const parts=participants(R),byF=(a,b)=>fam(b.p.id)-fam(a.p.id)||a.p.stu.localeCompare(b.p.stu);
  const ships={};parts.forEach(x=>{if(x.ship)(ships[x.ship]=ships[x.ship]||[]).push(x)});
  const land=parts.filter(x=>!x.ship).sort(byF);
  const shipList=Object.keys(ships).map(k=>{const m=ships[k].sort((a,b)=>(b.p.wall==="cap")-(a.p.wall==="cap")||byF(a,b));return{k,m,sum:m.reduce((s,x)=>s+fam(x.p.id),0)}}).sort((a,b)=>b.sum-a.sum);
  const st={};parts.forEach(x=>st[x.p.id]={x,tot:{}});
  const tot=(id,k)=>{const c=cell(R,id,k);if(c.roll==null||c.roll==="")return null;return{raw:+c.roll,t:+c.roll+(+c.sp||0)+sbOf(P(id))}};
  const pass=(r,need,p)=>r.t>=need&&!(r.raw===1&&!sbOf(p));
  shipList.forEach(s=>{const cap=s.m[0],r=tot(cap.p.id,1);s.m.forEach(x=>{const o=st[x.p.id];o.s1=r?(r.t>=2?"y":"s"):null;if(x===cap&&r)o.tot[1]=r.t})});
  land.forEach(x=>{const r=tot(x.p.id,1),o=st[x.p.id];if(r){o.tot[1]=r.t;o.s1=pass(r,5,x.p)?"y":"n"}else o.s1=null});

  const ref=so.ids.filter(id=>ch[id]==="X").length;
  $("main").className="";$("main").innerHTML=`<div class="panel"><table class="so">${rows}</table></div><div class="panel"><h2>Next available place</h2><div class="nx">${nx}</div>${ref?`<div class="held">Refusing: ${ref}</div>`:""}<div class="keys">Write your region and place on your plan sheet. Sack Worksheets due Tuesday, Nov 10, at 11:59pm.</div></div>`;
  document.querySelectorAll(".so select").forEach(s=>s.onchange=()=>{if(s.value)ch[s.dataset.id]=s.value;else delete ch[s.dataset.id];save();render()});
  const mv=(i,j)=>{const ids=[...so.ids];if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];D().sack.order=ids;save();render()};
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>mv(+b.dataset.u,+b.dataset.u-1));
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>mv(+b.dataset.d,+b.dataset.d+1));
  $("ctx").innerHTML=`<button id="reord">Recompute order</button>`;
  $("reord").onclick=()=>{D().sack.order=null;save();render()};
}
function renderSetup(){
  const d=D(),now=famaMap(9);$("phases").innerHTML="";
  $("h1").textContent="Setup";
  $("sub").innerHTML=d.loaded?`Fama loaded from <b>${esc(d.loaded)}</b>.`:"Fama not loaded yet: use “Load fama…” with the Fama Tracker.";
  const crew={};d.players.forEach(p=>{if(CAPS.includes(p.wall))crew[p.wall]=(crew[p.wall]||0)+1});
  const rows=d.players.map(p=>{const cap=capOf(p.char),ch=now[p.id]-(+p.fama||0);
    const wall=cap?`<select data-f="wall" data-id="${p.id}"><option value="cap"${p.wall==="cap"?" selected":""}>Captain (${cap})</option><option value="land"${p.wall==="land"?" selected":""}>Land walls</option></select>`
      :`<select data-f="wall" data-id="${p.id}"><option value="land"${p.wall==="land"?" selected":""}>Land walls</option>${CAPS.map(c=>`<option value="${c}"${p.wall===c?" selected":""}>Ship of ${c}</option>`).join("")}</select>${CAPS.includes(p.wall)&&crew[p.wall]>2?' <span class="warn">ship over 2 crew</span>':""}`;
    return`<tr class="${p.here?"":"abs"}"><td><input type="checkbox" data-f="here" data-id="${p.id}"${p.here?" checked":""}></td><td>${G(FAC[p.fac]||"")}${esc(p.char)}</td><td>${esc(p.stu)}</td><td><input type="number" data-f="fama" data-id="${p.id}" value="${p.fama}"></td><td class="chg ${ch>0?"pos":ch<0?"neg":""}">${ch>0?"+"+ch:ch<0?"−"+(-ch):"0"}</td><td class="now">${now[p.id]}</td><td>${wall}</td><td><input type="checkbox" data-f="vol" data-id="${p.id}"${p.vol?" checked":""}></td></tr>`}).join("");
  $("main").className="one";
  $("main").innerHTML=`<div class="panel"><p style="font-size:17px;margin:0 0 12px">Standard-Bearer’s faction: <select id="sbSel" style="font:inherit"><option value="">none yet</option>${Object.keys(FAC).map(f=>`<option value="${f}"${d.sb===f?" selected":""}>${FACNAME[f]}</option>`).join("")}</select>
  <span style="color:var(--mute);font-size:15px;margin-left:12px">Crew follow their captain: a ship sails in round 1 only if its captain volunteers.</span></p>
  <table class="st-t"><tr><th>Here</th><th>Character</th><th>Student</th><th>Start</th><th>Change</th><th>Now</th><th>Wall</th><th>Round 1</th></tr>${rows}</table></div>`;
  $("sbSel").onchange=e=>{d.sb=e.target.value;save();render()};
  document.querySelectorAll(".st-t [data-f]").forEach(el=>el.onchange=()=>{const p=P(el.dataset.id),f=el.dataset.f;p[f]=el.type==="checkbox"?el.checked:f==="fama"?(+el.value||0):el.value;save();render()});
  $("ctx").innerHTML="";
}
function render(){
  const key=S.sec+"|"+S.tab+"|"+S.setup+"|"+(S.tab[0]==="r"&&S.tab!=="r3"?D().rounds[S.tab[1]].step:"");
  const keepScroll=render.last===key?[...document.querySelectorAll("main .panel")].map(p=>p.scrollTop):null;
  render.last=key;
  $("secSel").value=S.sec;$("setupBtn").classList.toggle("on",S.setup);$("setupBtn").textContent=S.setup?"Setup ◂":"Setup ▸";
  tabs();
  if(S.setup)renderSetup();else if(S.tab==="r1")renderRound(1);else if(S.tab==="r2")renderRound(2);else if(S.tab==="r3")renderR3();else renderSack();
  if(keepScroll)document.querySelectorAll("main .panel").forEach((p,i)=>{if(keepScroll[i]!=null)p.scrollTop=keepScroll[i]});
}

/* ---------- popup ---------- */
function showOv(h,p){$("ovH").textContent=h;$("ovP").innerHTML=p;$("overlay").classList.remove("hidden");$("ovB").focus()}
$("ovB").onclick=()=>$("overlay").classList.add("hidden");
$("overlay").onclick=e=>{if(e.target.id==="overlay")$("overlay").classList.add("hidden")};

/* ---------- controls ---------- */
function flash(t){$("msg").textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>$("msg").textContent="",5000)}
$("secSel").onchange=e=>{S.sec=e.target.value;save();runClock();render()};
$("setupBtn").onclick=()=>{S.setup=!S.setup;save();render()};
$("loadBtn").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets["Totals"]||wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});const hi=aoa.findIndex(r=>r.includes("Student"));if(hi<0)throw"no Student column";
    const H=aoa[hi],ix=n=>H.indexOf(n),cS=ix("Section"),cN=ix("Student"),cC=ix("Character"),cF=ix("Faction"),cCur=ix("Current");
    const cSt=ix("Starting");
    // If Excel hasn't saved calculated values, work fama out from Starting + the Ledger tab.
    const blank=aoa.slice(hi+1).filter(r=>r[cN]).every(r=>r[cCur]===""||r[cCur]==null);
    let calc=null;
    if(blank&&wb.Sheets["Ledger"]&&cSt>=0){calc={};const L=XLSX.utils.sheet_to_json(wb.Sheets["Ledger"],{header:1,defval:""});const lh=L.findIndex(r=>r.includes("Student")&&r.includes("Type"));
      if(lh>=0){const LH=L[lh],ls=LH.indexOf("Section"),ln=LH.indexOf("Student"),lt=LH.indexOf("Type"),la=LH.indexOf("Amount");
        L.slice(lh+1).forEach(r=>{const k=String(r[ls]).trim()+"|"+String(r[ln]).trim(),a=+r[la]||0,ty=String(r[lt]).trim();if(!r[ln]||!a||/^EXAMPLE/i.test(String(r[0])))return;calc[k]=(calc[k]||0)+(ty==="Earned"?a:-a)})}}
    let n=0;["02","12"].forEach(sec=>{const d=S.data[sec];
      aoa.slice(hi+1).filter(r=>String(r[cS]).includes(sec)&&r[cN]).forEach(r=>{let p=d.players.find(x=>x.stu===String(r[cN]).trim());
        if(!p){const ch=String(r[cC]);p={id:sec+"-x"+d.players.length,stu:String(r[cN]).trim(),char:ch,fac:String(r[cF])||"Indeterminate",fama:0,wall:capOf(ch)?"cap":"land",vol:false,here:true};d.players.push(p)}
        p.fama=calc?(+r[cSt]||0)+(calc[String(r[cS]).trim()+"|"+String(r[cN]).trim()]||0):(+r[cCur]||0);n++});d.loaded=f.name});
    save();render();flash(`Loaded fama for ${n} students${calc?" (worked out from the Ledger)":""}.`)}catch(err){flash("Couldn’t read that file: "+err)}
  e.target.value=""};
const csv=rows=>rows.map(r=>r.map(v=>{v=String(v??"");return/[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(",")).join("\n");
function ledger(){const dt=new Date(),ds=`${dt.getMonth()+1}/${dt.getDate()}/${dt.getFullYear()}`;return changes(9).map(([id,t,n,why])=>[ds,"Sec "+S.sec,P(id).stu,t,n,why])}
function ledgerCSV(){return csv([["Date","Section","Student","Type","Amount","Reason"],...ledger()])}
function sackCSV(){const so=sackOrder();if(!so)return"";const {res}=slots(so.ids),ch=D().sack.ch;
  return csv([["Order","Student","Character","Group","Region","Place","Code"],...so.ids.map((id,i)=>{const p=P(id),c=ch[id];const rg=c==="X"?"Refuses":c?REG.find(r=>r[0]===c)[1]:"";return[i+1,p.stu,p.char,TIERS[so.tier[id]],rg,c&&c!=="X"&&res[id]?ORD[res[id]-1]:"",c&&c!=="X"&&res[id]?c+res[id]:""]})])}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/csv"}));a.download=name;a.click()}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,"");
$("ledgerBtn").onclick=()=>{dl(`Siege_Ledger_Sec${S.sec}_${stamp()}.csv`,ledgerCSV());flash(`${ledger().length} fama rows saved.`)};
$("sackBtn").onclick=()=>{const t=sackCSV();if(!t){flash("The city hasn’t fallen yet.");return}dl(`Sack_Order_Sec${S.sec}_${stamp()}.csv`,t)};
$("mailBtn").onclick=async()=>{
  if(location.protocol==="file:"){flash("Email only works on the Netlify site. Use the CSV buttons here.");return}
  try{const r=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({"form-name":"siege-record",section:"Sec "+S.sec,ledger:ledgerCSV(),sack:sackCSV()||"(city not taken)"}).toString()});
    if(!r.ok)throw r.status;flash("Sent. Check your email (and Netlify ▸ Forms).")}catch(err){flash("Didn’t send ("+err+"). Download the CSVs instead.")}};
$("resetBtn").onclick=()=>{if(!confirm(`Erase all siege data for Section ${S.sec}? Fama loaded from the tracker is kept.`))return;const old=D(),n=fresh(S.sec);
  n.players=old.players.map(p=>({...p}));n.loaded=old.loaded;n.sb=old.sb;S.data[S.sec]=n;S.tab="r1";save();runClock();render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("overlay").classList.add("hidden");return}if(e.target.matches("input,select,textarea"))return;if(e.key==="h"||e.key==="H")$("ctl").classList.toggle("hidden")});
runClock();render();
</script>
